[workspace]
members = ["descriptor"]

[package]
name = "teptris"
version = "0.1.2"
edition = "2021"
description = "Rust bindings for libteptris — TOML 1.1 at C speed, no fallback"
license = "MIT"
readme = "README.adoc"
repository = "https://github.com/leptris/teptris-rs"
links = "teptris"
build = "build.rs"

[dependencies]

[dev-dependencies]
teptris-descriptor = { path = "descriptor", features = ["link"] }
