[workspace]
members = ["descriptor"]

[package]
name = "teptris"
version = "0.3.9"
edition = "2021"
description = "Rust bindings for libteptris — TOML 1.1 at C speed, no fallback"
license = "MIT"
readme = "README.adoc"
repository = "https://github.com/leptris/teptris-rs"
links = "teptris"
build = "build.rs"

[dependencies]
serde = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
teptris-descriptor = { path = "descriptor", features = ["link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[[bench]]
name = "tier"
harness = false

[[bench]]
name = "serde_tier"
harness = false
required-features = ["serde"]

[[bench]]
name = "plan_tier"
harness = false
required-features = ["serde"]
