# Release pipeline for teptris-rs
#
# release-plz handles the versioning side: conventional commits in,
# release PR + GitHub release out. Publishing goes through crates.io
# Trusted Publishing — the job exchanges its OIDC identity for a
# short-lived publish token, so no CARGO_REGISTRY_TOKEN secret ever
# exists.
#
# The pipeline runs in two phases, decoupled on purpose:
#   1. update — opens/updates the release PR (version bump +
#      changelog + lockfile). Needs only GITHUB_TOKEN, so release
#      PRs flow even while publishing is not yet wired up.
#   2. release — exchanges the OIDC token and publishes landed
#      versions, creating the GitHub releases.
#
# One-time setup (owner, crates.io UI) for phase 2:
#   Account settings → Trusted Publishing → add leptris/teptris-rs,
#   workflow "release.yml", environment left empty.
# Until then phase 2 fails with "No Trusted Publishing config
# found" and versions publish manually — phase 1 is unaffected.
# Both phases run on the workflow's own github.token (contents +
# pull-requests: write above). The org PAT in LEPTRIS_CI_PAT_TOKEN
# predates this repo and 404s on ref creation here — release PRs
# made with github.token do not re-trigger CI on themselves; once
# the PAT's repository list includes teptris-rs, it can return.
# See: https://release-plz.dev/docs/config

name: Release

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Phase 1 — release PR management. Independent of registry
      # auth so it runs regardless of Trusted Publishing state.
      - name: Open/update the release PR
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Phase 2 — publish what has landed on main. Fails (by
      # design, loudly) until Trusted Publishing is registered.
      - name: Exchange OIDC for a crates.io publish token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish landed releases
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
