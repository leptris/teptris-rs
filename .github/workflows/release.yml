# Release pipeline for teptris-rs
#
# release-plz handles the versioning side: conventional commits in,
# release PR + GitHub release out. Publishing goes through crates.io
# Trusted Publishing — the job exchanges its OIDC identity for a
# short-lived publish token, so no CARGO_REGISTRY_TOKEN secret ever
# exists.
#
# One-time setup (owner, crates.io UI):
#   Account settings → Trusted Publishing → add leptris/teptris-rs,
#   workflow "release.yml", environment left empty.
# Optional (release PRs that re-trigger CI): the org PAT in the
# LEPTRIS_CI_PAT_TOKEN secret — without it, release PRs created
# with the default token do not start their own CI runs.
#
# Until TP is configured on crates.io, the auth step fails and this
# job stops — the intended state while versions publish manually.
# See: https://release-plz.dev/docs/config

name: Release

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Exchange OIDC for a crates.io publish token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.LEPTRIS_CI_PAT_TOKEN || github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
