name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout engine repository
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          ref: v0.3.4
          path: engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build libteptris shared library
        shell: bash
        run: |
          cmake -B engine/build-shared -S engine \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEPTRIS_BUILD_SHARED=ON -DTEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DTEPTRIS_BUILD_CLI=OFF
          cmake --build engine/build-shared --config Release
          LIB=$(find engine/build-shared -type f -o -type l 2>/dev/null | grep -iE '(lib)?teptris\.(dylib|so)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libteptris shared library not found"
            exit 1
          fi
          LIBDIR=$(cd "$(dirname "$LIB")" && pwd)
          echo "TEPTRIS_LIB_PATH=$LIBDIR" >> "$GITHUB_ENV"
          echo "Built: $LIB"
      - name: cargo build
        run: cargo build --workspace --verbose
      - name: cargo test
        run: cargo test --workspace --verbose
      # rust tier: teptris-rs vs the toml crate over the engine
      # corpus — report only, no gate (runner noise; the family
      # referee limit applies).
      - name: rust tier bench (report only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 engine/scripts/gen_bench_corpus.py corpus
          cargo bench --bench tier -- corpus 20
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
